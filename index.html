<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f6" />
    <meta name="description" content="זמני הגעה חיים לתחנת האוטובוס שלך" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>תחנה</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var theme = params.get("theme");
        var lang = params.get("lang");
        try {
          theme = theme || localStorage.getItem("theme");
          lang = lang || localStorage.getItem("lang");
        } catch (e) {}
        var dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        if (lang === "en") {
          document.documentElement.lang = "en";
          document.documentElement.dir = "ltr";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
